name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build sideloadable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css game-phaser.js www/
          cp -r assets www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Apply app icon and release version
        run: npm run android:brand

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "save-the-newts-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: save-the-newts-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
